<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Test</title>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-8">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">Tailwind CSS is Working! 🎉</h1>
            <p class="text-gray-600 mb-6">If you can see this styled beautifully, Tailwind is properly configured.</p>
            <div class="space-y-3">
                <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200">
                    Primary Button
                </button>
                <button class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200">
                    Success Button
                </button>
                <button class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200">
                    Danger Button
                </button>
            </div>
            <div class="mt-6 p-4 bg-gradient-to-r from-pink-500 to-yellow-500 rounded-lg">
                <p class="text-white font-semibold text-center">Gradient Background Test</p>
            </div>
        </div>
    </div>
</body>
</html>
