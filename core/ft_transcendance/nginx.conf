user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Redirect HTTP -> HTTPS
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/self.crt;
    ssl_certificate_key /etc/ssl/private/self.key;

    # Modern TLS (fine for dev; production can tighten ciphers further)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # CSP blocks XSS by default. We allow Google Fonts styles/fonts only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:;" always;

    # Limit powerful features by default
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self)" always;

    # In prod, enable HSTS. Keep commented on localhost to avoid sticky HTTPS during dev:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }

    # Cache static
    location ~* \.(js|css)$ {
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }
  }
}
