<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ft_transcendence • Pong Arena</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg-main: #020617;
      --bg-alt: #020617;
      --card-bg: rgba(15, 23, 42, 0.92);
      --card-border: rgba(148, 163, 184, 0.25);
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.2);
      --accent-strong: #a855f7;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --danger: #f97373;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.75);
      --header-h: 68px;
      --transition-fast: 0.18s ease-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      background:
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.06), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.20), transparent 55%),
        radial-gradient(circle at 0% 100%, rgba(244, 114, 182, 0.10), transparent 60%),
        linear-gradient(145deg, #020617 0%, #020617 50%, #020617 100%);
      background-attachment: fixed;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ========== HEADER ========== */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--header-h);
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(6, 8, 23, 0.95), rgba(6, 8, 23, 0.8));
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-and-nav {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .brand span.logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: conic-gradient(from 140deg, #22d3ee, #6366f1, #a855f7, #22d3ee);
      box-shadow: 0 0 12px rgba(129, 140, 248, 0.9);
      display: inline-block;
    }

    .brand span.sub {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition:
        background-color var(--transition-fast),
        color var(--transition-fast),
        box-shadow var(--transition-fast),
        transform var(--transition-fast),
        border-color var(--transition-fast);
      white-space: nowrap;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #f9fafb;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.55);
    }

    .btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(79, 70, 229, 0.7);
    }

    .btn.outline {
      border-color: rgba(148, 163, 184, 0.5);
      color: var(--text-main);
      background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.1), transparent 60%);
    }

    .btn.outline:hover {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(129, 140, 248, 0.9);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.8);
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: transparent;
    }

    .btn.ghost:hover {
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
    }

    /* ========== LAYOUT ========== */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: calc(100vh - var(--header-h) - 80px);
    }

    /* ========== CARD / PANELS ========== */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-soft);
      padding: 22px 22px 20px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      backdrop-filter: blur(18px);
      transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        border-color var(--transition-fast);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.09), transparent 55%),
        radial-gradient(circle at 100% 0%, rgba(129, 140, 248, 0.18), transparent 60%);
      opacity: 0.45;
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: -1;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 26px 60px rgba(15, 23, 42, 0.95);
      border-color: rgba(129, 140, 248, 0.65);
    }

    .card h1,
    .card h2 {
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .card h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .card h3 {
      font-size: 1rem;
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .error-message {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--danger);
    }

    /* Horizontal split (e.g. form + preview) */
    .row {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1 1 0;
      min-width: 0;
    }

/* ===== Global form field styling ===== */

.input-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.input-field label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-muted);
}

/* All text-like inputs everywhere (names, emails, aliases, etc.) */
input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="search"],
input[type="url"],
input[type="tel"],
textarea,
select {
  border-radius: 12px;
  border: 1px solid rgba(148, 163, 184, 0.45);
  background: rgba(15, 23, 42, 0.92);
  color: var(--text-main);
  padding: 8px 10px;
  font-size: 0.9rem;
  outline: none;
  width: 100%;
  max-width: 100%;
  transition:
    border-color var(--transition-fast),
    box-shadow var(--transition-fast),
    background-color var(--transition-fast),
    transform var(--transition-fast);
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.75);
}

input::placeholder,
textarea::placeholder {
  color: var(--text-muted);
  opacity: 0.85;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
input[type="search"]:focus,
input[type="url"]:focus,
input[type="tel"]:focus,
textarea:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.9), 0 14px 30px rgba(17, 24, 39, 0.9);
  background: rgba(15, 23, 42, 1);
  transform: translateY(-1px);
}

/* File inputs get a pill / dashed style */
input[type="file"] {
  border-radius: 999px;
  border-style: dashed;
  border-color: rgba(148, 163, 184, 0.6);
  padding: 6px 10px;
  background: rgba(15, 23, 42, 0.85);
  cursor: pointer;
}

/* Don’t turn checkboxes / radios into pills */
input[type="checkbox"],
input[type="radio"] {
  width: auto;
  min-width: 0;
  padding: 0;
  box-shadow: none;
  border-radius: 4px;
  background: #020617;
}

    /* Score badges (Game / Local / AI views) */
    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: #e5e7eb;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(129, 140, 248, 0.6);
    }

    /* Tournament matchups */
    .matchup {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(31, 41, 55, 0.9);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .matchup span {
      opacity: 0.9;
    }

    /* Canvas (Game / Local / AI) */
    canvas {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: 14px auto 12px;
      aspect-ratio: 16 / 9;
      background:
        radial-gradient(circle at 0% 0%, rgba(30, 64, 175, 0.35), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(8, 47, 73, 0.9), transparent 60%),
        radial-gradient(circle at 50% 50%, #020617, #020617 70%);
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.95);
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 8px 16px 18px;
    }

    footer a {
      color: var(--accent);
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Small screens */
    @media (max-width: 768px) {
      .header-inner {
        padding-inline: 14px;
      }

      .brand {
        font-size: 0.95rem;
      }

      .container {
        padding-inline: 14px;
      }

      .row {
        flex-direction: column;
      }

      .card {
        padding: 18px 16px 16px;
      }

      canvas {
        margin-top: 10px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand-and-nav">
        <div class="brand">
          <span class="logo-dot"></span>
          <span>ft_transcendence</span>
          <span class="sub">Pong Arena</span>
        </div>
      </div>

      <!-- Filled / updated dynamically by navbar.ts -->
      <div class="header-actions">
        <a href="/" data-link class="btn ghost">Home</a>
        <a href="/profile" data-link class="btn outline">My Profile</a>
        <!-- When logged in, JS will replace this with avatar + menu -->
      </div>
    </div>
  </header>

  <main id="app" class="container">
    <!-- Your SPA views (Home / Tournament / Game / AI / Profile…) are rendered here by main.ts/router.ts -->
    <noscript>
      <div class="card">
        <h2>JavaScript required</h2>
        <p class="muted">
          This application is a single-page app. Please enable JavaScript to play Pong and access tournaments.
        </p>
      </div>
    </noscript>
  </main>

  <footer>
    <p>
      &copy; 2025 ft_transcendence · Built with love, TypeScript and Pong.
    </p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
